[project]
name = "agentic-bi-copilot"
version = "0.1.0"
description = "A safe, human-approved agentic analytics copilot for PostgreSQL retail data"
readme = "README.md"
authors = [
    { name = "Atishya Jain", email = "jainatishya53@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faker>=40.36.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langsmith>=0.11.0",
    "openai>=2.0.0",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.52",
    "sqlglot>=30.17.0",
    "streamlit>=1.61.1",
]

[project.scripts]
agentic-bi-copilot = "agentic_bi_copilot:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.fastapi]
entrypoint = "agentic_bi_copilot.api.main:app"
